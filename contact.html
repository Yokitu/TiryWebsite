<!DOCTYPE html>
<html lang="zh-CN" data-theme="teal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>联系我们 - Tiry</title>
    <!-- 引入 M3E 通用样式 -->
    <link rel="stylesheet" href="./m3e.css">
    <style>
        body { padding-bottom: 32px; }
        .app-container { max-width: 500px; margin: 0 auto; padding: 16px; }
        .section-title { font-size: 20px; font-weight: 500; color: var(--md-on-surface-variant); margin: 24px 8px 12px; }
        a.m3e-list-item { text-decoration: none; color: var(--md-on-surface); }
        
        /* 复制功能的视觉反馈 */
        .copy-toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--md-inverse-surface); color: var(--md-inverse-on-surface);
            padding: 12px 24px; border-radius: 999px; font-size: 14px;
            transition: all 0.3s var(--spring); opacity: 0; pointer-events: none; z-index: 100;
        }
        .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <!-- 顶部应用栏 -->
    <header class="m3e-appbar">
        <button class="m3e-icon-btn" onclick="window.location.href='./index.html'">
            <span class="material-symbols-rounded">arrow_back</span>
        </button>
        <div class="title">联系我们</div>
    </header>

    <div class="app-container">
        
        <!-- 团队成员 -->
        <div class="section-title">天边橒（团长）</div>
        <div class="m3e-list">
            <div class="m3e-list-item" onclick="copyText('3623633553')">
                <div class="lead"><span class="material-symbols-rounded">chat</span></div>
                <div class="content">
                    <div class="title">QQ</div>
                    <div class="subtitle">3623633553</div>
                </div>
                <div class="trailing"><span class="material-symbols-rounded">content_copy</span></div>
            </div>
            <a href="https://github.com/Yokitu" target="_blank" class="m3e-list-item">
                <div class="lead"><span class="material-symbols-rounded">code</span></div>
                <div class="content">
                    <div class="title">GitHub</div>
                    <div class="subtitle">@Yokitu</div>
                </div>
                <div class="trailing"><span class="material-symbols-rounded">open_in_new</span></div>
            </a>
            <div class="m3e-list-item" onclick="copyText('3623633553@qq.com')">
                <div class="lead"><span class="material-symbols-rounded">mail</span></div>
                <div class="content">
                    <div class="title">邮箱</div>
                    <div class="subtitle">3623633553@qq.com</div>
                </div>
                <div class="trailing"><span class="material-symbols-rounded">content_copy</span></div>
            </div>
        </div>

        <!-- 其他团队成员 -->
        <div class="section-title">Jidurt</div>
        <div class="m3e-list">
            <div class="m3e-list-item" onclick="copyText('3427780794')">
                <div class="lead"><span class="material-symbols-rounded">chat</span></div>
                <div class="content">
                    <div class="title">QQ</div>
                    <div class="subtitle">3427780794</div>
                </div>
                <div class="trailing"><span class="material-symbols-rounded">content_copy</span></div>
            </div>
        </div>

        <!-- 鸣谢 / 外部支持者 -->
        <div class="section-title">特别鸣谢</div>
        <div class="m3e-list">
            <a href="https://github.com/jingluohuan" target="_blank" class="m3e-list-item">
                <div class="lead" style="background-color: var(--md-tertiary-container); color: var(--md-on-tertiary-container);">
                    <span class="material-symbols-rounded">verified</span>
                </div>
                <div class="content">
                    <div class="title">靖落欢 (猫猫)</div>
                    <div class="subtitle">感谢提供域名与加速服务支持</div>
                </div>
                <div class="trailing"><span class="material-symbols-rounded">chevron_right</span></div>
            </a>
        </div>

        <!-- 底部返回按钮 -->
        <div style="margin-top: 40px;">
            <a href="./index.html" class="m3e-btn text" style="width: 100%; justify-content: flex-start; padding-left: 16px;">
                <span class="material-symbols-rounded">home</span>
                返回团队主页
            </a>
        </div>

    </div>

    <!-- 复制提示框 -->
    <div class="copy-toast" id="toast">已复制到剪贴板</div>

    <script>
        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                }).catch(err => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "absolute";
            textArea.style.left = "-999999px";
            document.body.prepend(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (error) {
                console.error(error);
            } finally {
                textArea.remove();
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>

</body>
</html>
