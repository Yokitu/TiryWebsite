<!DOCTYPE html>
<html lang="zh-CN" data-theme="teal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>学习资料库 - Tiry</title>
    <!-- 引入通用 M3E 样式 -->
    <link rel="stylesheet" href="./m3e.css">
    <style>
        body { padding-bottom: 32px; }
        .app-container { max-width: 500px; margin: 0 auto; padding: 16px; }
        .section-title { font-size: 20px; font-weight: 500; color: var(--md-on-surface-variant); margin: 24px 8px 12px; }
        
        /* 自定义下拉菜单样式 */
        .filter-group { margin-bottom: 20px; }
        .filter-label {
            font-size: 14px; color: var(--md-on-surface-variant);
            margin-bottom: 8px; margin-left: 4px; display: block;
        }
        .m3e-select .box {
            background-color: var(--md-surface-container-lowest);
            border: 1px solid var(--md-outline-variant);
            height: 56px; border-radius: 16px;
        }
        .m3e-select .box .val { font-size: 16px; font-weight: 500; }
        
        /* 横向并排布局 (3列) */
        .row-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .row-group .filter-group {
            flex: 1;
            margin-bottom: 0;
        }
        
        /* 提示条 */
        .info-banner {
            display: flex; align-items: center; gap: 12px;
            background-color: var(--md-primary-container);
            color: var(--md-on-primary-container);
            padding: 16px; border-radius: 16px;
            font-size: 14px; margin-bottom: 24px; line-height: 1.5;
        }

        /* 按钮 */
        .search-btn {
            width: 100%; height: 56px; font-size: 18px; margin-top: 12px;
            border-radius: 999px;
            background-color: var(--md-primary);
            color: var(--md-on-primary);
            border: none; display: flex; justify-content: center; align-items: center;
            gap: 8px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s var(--spring);
        }
        .search-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <header class="m3e-appbar">
        <button class="m3e-icon-btn" onclick="window.location.href='./nav.html'">
            <span class="material-symbols-rounded">arrow_back</span>
        </button>
        <div class="title">学习资料库</div>
    </header>

    <div class="app-container">
        
        <div class="info-banner">
            <span class="material-symbols-rounded" style="font-size: 28px;">info</span>
            <div>目前所有资料均为 <b>人教版</b>，请选择对应的科目、年级和册数进行查找。</div>
        </div>

        <!-- 学科 -->
        <div class="filter-group">
            <label class="filter-label">选择学科</label>
            <div class="m3e-select" id="select-subject">
                <div class="box" onclick="toggleMenu('subject')">
                    <span class="val" id="val-subject">语文</span>
                    <span class="material-symbols-rounded">arrow_drop_down</span>
                </div>
                <div class="menu" id="menu-subject">
                    <div class="menu-item" data-val="chi" data-abbr="chi">语文</div>
                    <div class="menu-item" data-val="mat" data-abbr="mat">数学</div>
                    <div class="menu-item" data-val="eng" data-abbr="eng">英语</div>
                    <div class="menu-item" data-val="phy" data-abbr="phy">物理</div>
                    <div class="menu-item" data-val="che" data-abbr="che">化学</div>
                    <div class="menu-item" data-val="bio" data-abbr="bio">生物</div>
                    <div class="menu-item" data-val="his" data-abbr="his">历史</div>
                    <div class="menu-item" data-val="geo" data-abbr="geo">地理</div>
                    <div class="menu-item" data-val="pol" data-abbr="pol">道法</div>
                </div>
            </div>
        </div>

        <!-- 年级、册数、版本 并排 -->
        <div class="row-group">
            <!-- 年级 -->
            <div class="filter-group">
                <label class="filter-label">年级</label>
                <div class="m3e-select" id="select-grade">
                    <div class="box" onclick="toggleMenu('grade')">
                        <span class="val" id="val-grade">七年级</span>
                        <span class="material-symbols-rounded">arrow_drop_down</span>
                    </div>
                    <div class="menu" id="menu-grade">
                        <div class="menu-item" data-val="07">七年级</div>
                        <div class="menu-item" data-val="08">八年级</div>
                        <div class="menu-item" data-val="09">九年级</div>
                    </div>
                </div>
            </div>

            <!-- 册数 -->
            <div class="filter-group">
                <label class="filter-label">册数</label>
                <div class="m3e-select" id="select-term">
                    <div class="box" onclick="toggleMenu('term')">
                        <span class="val" id="val-term">上册</span>
                        <span class="material-symbols-rounded">arrow_drop_down</span>
                    </div>
                    <div class="menu" id="menu-term">
                        <div class="menu-item" data-val="0">上册</div>
                        <div class="menu-item" data-val="1">下册</div>
                    </div>
                </div>
            </div>

            <!-- 版本 -->
            <div class="filter-group">
                <label class="filter-label">版本</label>
                <div class="m3e-select" id="select-version">
                    <div class="box" onclick="toggleMenu('version')">
                        <span class="val" id="val-version">版本 A</span>
                        <span class="material-symbols-rounded">arrow_drop_down</span>
                    </div>
                    <div class="menu" id="menu-version">
                        <div class="menu-item" data-val="a">版本 A</div>
                        <div class="menu-item" data-val="z">版本 Z</div>
                        <div class="menu-item" data-val="t">版本 T</div>
                    </div>
                </div>
            </div>
        </div>

        <button class="search-btn" onclick="findMaterial()">
            <span class="material-symbols-rounded">search</span>
            查找学习资料
        </button>

    </div>

    <script>
        // 存储当前选中的值
        let currentSelection = {
            subject: 'chi',
            grade: '07',
            term: '0',
            version: 'a'
        };

        // 切换下拉菜单
        function toggleMenu(id) {
            document.querySelectorAll('.m3e-select .menu').forEach(menu => {
                if (menu.id !== 'menu-' + id) menu.classList.remove('open');
            });
            document.getElementById('menu-' + id).classList.toggle('open');
        }

        // 绑定菜单点击事件
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const menu = e.target.closest('.menu');
                const menuId = menu.id.replace('menu-', '');
                const val = e.target.getAttribute('data-val');
                
                currentSelection[menuId] = val;

                if (menuId === 'subject') {
                    document.getElementById('val-subject').textContent = e.target.textContent;
                } else if (menuId === 'grade') {
                    document.getElementById('val-grade').textContent = e.target.textContent;
                } else if (menuId === 'term') {
                    document.getElementById('val-term').textContent = e.target.textContent;
                } else if (menuId === 'version') {
                    document.getElementById('val-version').textContent = e.target.textContent;
                }

                menu.classList.remove('open');
            });
        });

        // 点击空白处关闭菜单
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.m3e-select')) {
                document.querySelectorAll('.m3e-select .menu').forEach(menu => menu.classList.remove('open'));
            }
        });

        // 核心拼接并跳转逻辑
        function findMaterial() {
            const subjectElement = document.querySelector(`#menu-subject .menu-item[data-val="${currentSelection.subject}"]`);
            const subjectAbbr = subjectElement.getAttribute('data-abbr'); // 如 eng
            const grade = currentSelection.grade;
            const term = currentSelection.term;
            const version = currentSelection.version; // a, z, t

            // 拼接文件名: 学科 + 年级 + 册数 + 版本 + .html
            const fileName = `${subjectAbbr}${grade}${term}${version}.html`;
            const targetUrl = `./study/${fileName}`;

            const isExist = confirm(`即将为你打开：\n${fileName}\n\n（如果点击确定后找不到页面，说明此资料暂未上传~）`);
            if (isExist) window.location.href = targetUrl;
        }
    </script>
</body>
</html>
