<!DOCTYPE html>
<html lang="zh-CN" data-theme="purple">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrV 时间演示 - Tiry</title>
    <!-- 引入通用 M3E 样式 -->
    <link rel="stylesheet" href="./m3e.css">
    <!-- 引入你刚才写的 TrV 时间计算库 -->
    <script src="./trvtime.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--md-surface-container-lowest);
            padding: 24px;
            box-sizing: border-box;
        }

        /* 主卡片 */
        .time-card {
            background: var(--md-surface);
            border-radius: 28px;
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(103, 80, 164, 0.1);
            border: 1px solid var(--md-outline-variant);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 装饰背景 */
        .time-card::before {
            content: '';
            position: absolute;
            top: -50px; right: -50px;
            width: 150px; height: 150px;
            background: var(--md-primary-container);
            border-radius: 50%;
            opacity: 0.5;
            z-index: 0;
        }

        .time-card > * {
            position: relative;
            z-index: 1;
        }

        .label {
            font-size: 14px;
            color: var(--md-on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .main-time {
            font-size: 36px;
            font-weight: 800;
            color: var(--md-primary);
            line-height: 1.2;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        .season-badge {
            display: inline-block;
            background: var(--md-tertiary-container);
            color: var(--md-on-tertiary-container);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 32px;
        }

        /* 详细信息网格 */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            text-align: left;
            border-top: 1px dashed var(--md-outline-variant);
            padding-top: 24px;
        }

        .detail-item {
            background: var(--md-surface-container);
            padding: 12px 16px;
            border-radius: 12px;
        }

        .detail-label {
            font-size: 12px;
            color: var(--md-on-surface-variant);
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--md-on-surface);
        }

        .refresh-btn {
            margin-top: 32px;
            background: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            padding: 14px 32px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: transform 0.2s;
        }
        
        .refresh-btn:active {
            transform: scale(0.96);
        }
        
        .note {
            margin-top: 24px;
            font-size: 13px;
            color: var(--md-on-surface-variant);
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="time-card">
        <div class="label">当前 Tirvod 时间</div>
        
        <!-- 动态时间显示 -->
        <div class="main-time" id="trvString">加载中...</div>
        
        <!-- 季节 -->
        <div class="season-badge" id="trvSeason">-</div>

        <!-- 详细数据拆解 -->
        <div class="details-grid">
            <div class="detail-item">
                <div class="detail-label">年 (Year)</div>
                <div class="detail-value" id="valYear">-</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">月 (Month)</div>
                <div class="detail-value" id="valMonth">-</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">日 (Day)</div>
                <div class="detail-value" id="valDay">-</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">时:分:秒</div>
                <div class="detail-value" id="valTime">-</div>
            </div>
        </div>

        <button class="refresh-btn" onclick="updateTime()">
            <span class="material-symbols-rounded">sync</span>
            刷新并计算
        </button>
    </div>

    <div class="note">
        此页面调用了 <code>./trvtime.js</code> 进行实时换算。<br>
        在真实 App 中，你可以每秒自动刷新一次。
    </div>

    <script>
        function updateTime() {
            // 调用你在 trvtime.js 里写的全局函数
            const timeData = getTrvTime();

            if (timeData.error) {
                document.getElementById('trvString').textContent = timeData.error;
                return;
            }

            // 更新主显示
            document.getElementById('trvString').textContent = `童世 ${timeData.year} 年 ${timeData.month} 月 ${timeData.day} 日`;
            document.getElementById('trvSeason').textContent = timeData.season;

            // 更新详情拆解
            document.getElementById('valYear').textContent = timeData.year;
            document.getElementById('valMonth').textContent = timeData.month;
            document.getElementById('valDay').textContent = timeData.day;
            
            const h = String(timeData.hour).padStart(2, '0');
            const m = String(timeData.minute).padStart(2, '0');
            const s = String(timeData.second).padStart(2, '0');
            document.getElementById('valTime').textContent = `${h}:${m}:${s}`;
        }

        // 页面加载时执行一次
        updateTime();
    </script>

</body>
</html>
