<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>活动已结束 - 选座工具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 原版座位表的样式保留（这里为了性能做了精简，只保留基础排版） */
  :root {
    --bg: #F4F8FF;
    --surface: #FFFFFF;
    --primary: #1565C0;
    --text: #1A1C1E;
    --border: #C4C6D0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F172A;
      --surface: #1E293B;
      --primary: #64B5F6;
      --text: #E2E8F0;
      --border: #334155;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px 16px;
    overflow: hidden; /* 防止底层滚动 */
  }

  /* 底层背景内容容器 */
  .underlying-content {
    width: 100%;
    max-width: 420px;
    background-color: var(--surface);
    border-radius: 32px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    /* 模拟一些虚化的背景内容 */
    opacity: 0.5;
    pointer-events: none; /* 禁用底层点击 */
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 84px);
    grid-template-rows: repeat(3, 84px);
    gap: 8px;
    background-color: var(--border);
    padding: 8px;
    border-radius: 20px;
    margin: 10px 0;
  }
  .seat {
    background-color: var(--surface);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
  }
  .seat.fixed { background-color: var(--primary); color: #FFF; }

  /* ======== 核心：模糊遮罩与弹窗 ======== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(255, 255, 255, 0.1); /* 极浅的底色 */
    backdrop-filter: blur(12px); /* 核心：毛玻璃模糊效果 */
    -webkit-backdrop-filter: blur(12px); /* 兼容 Safari */
    padding: 24px;
    animation: fadeIn 0.4s ease-out;
  }

  @media (prefers-color-scheme: dark) {
    .overlay {
      background: rgba(0, 0, 0, 0.2);
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* 弹窗卡片 */
  .dialog-card {
    background-color: var(--surface);
    width: 100%;
    max-width: 340px;
    border-radius: 28px; /* M3E 标准圆角 */
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: scaleUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); /* 弹簧动效 */
  }

  @keyframes scaleUp {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .dialog-icon {
    font-size: 56px;
    margin-bottom: 8px;
  }

  .dialog-title {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
  }

  .dialog-desc {
    font-size: 15px;
    color: var(--text);
    opacity: 0.7;
    line-height: 1.5;
    margin-bottom: 12px;
  }

  /* 前往主站按钮 */
  .btn-home {
    width: 100%;
    height: 56px;
    border-radius: 999px;
    background-color: var(--primary);
    color: #FFF;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    transition: transform 0.2s, opacity 0.2s;
    border: none;
    cursor: pointer;
  }

  .btn-home:active {
    transform: scale(0.95);
    opacity: 0.9;
  }
</style>
</head>
<body>

  <!-- 底层模糊的旧版座位表（仅做视觉背景） -->
  <div class="underlying-content">
    <h1 style="font-size: 24px; font-weight: 700; color: var(--primary);">班上要换座位了</h1>
    <p style="font-size: 14px; text-align: center;">如果自选座位，你想坐我附近吗？</p>
    <div class="grid">
      <div class="seat">(1,1)</div>
      <div class="seat">(1,2)</div>
      <div class="seat">(1,3)</div>
      <div class="seat">(2,1)</div>
      <div class="seat fixed">橒</div>
      <div class="seat">(2,3)</div>
      <div class="seat">(3,1)</div>
      <div class="seat">(3,2)</div>
      <div class="seat">(3,3)</div>
    </div>
    <div style="width: 100%; display: flex; gap: 10px;">
      <div style="flex: 1; height: 48px; border: 1px solid var(--border); border-radius: 16px;"></div>
      <div style="width: 48px; height: 48px; border: 1px solid var(--border); border-radius: 16px;"></div>
    </div>
    <div style="width: 100%; height: 56px; background-color: var(--primary); opacity: 0.5; border-radius: 16px; margin-top: 10px;"></div>
  </div>

  <!-- 顶层遮罩与提示框 -->
  <div class="overlay">
    <div class="dialog-card">
      <div class="dialog-icon">🎈</div>
      <div class="dialog-title">活动已结束</div>
      <div class="dialog-desc">
        感谢大家的热情参与！<br>
        自选座位活动已经圆满结束。<br>
        新版选座工具正在紧急开发中，敬请期待~
      </div>
      
      <!-- 前往主站按钮 -->
      <a href="../index.html" class="btn-home">
        <span style="font-size: 20px;">🏠</span>
        前往主站
      </a>
    </div>
  </div>

</body>
</html>
