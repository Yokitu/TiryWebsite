<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>选座 - Tiry</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F8FF;
    --surface: #FFFFFF;
    --primary: #1565C0;
    --primary-light: #E3F2FD;
    --text: #1A1C1E;
    --text-muted: #43474E;
    --border: #E2E8F0;
    --grid-bg: #CBD5E1;
    --glass: rgba(255, 255, 255, 0.7);
    --shadow: rgba(0,0,0,0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F172A;
      --surface: #1E293B;
      --primary: #64B5F6;
      --primary-light: #1E3A8A;
      --text: #E2E8F0;
      --text-muted: #94A3B8;
      --border: #334155;
      --grid-bg: #0F172A;
      --glass: rgba(15, 23, 42, 0.7);
      --shadow: rgba(0,0,0,0.4);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    overflow: hidden;
  }

  /* 顶部栏 */
  .top-bar {
    width: 100%;
    max-width: 380px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 20px;
    transition: filter 0.3s;
  }
  .title-area {
    display: flex;
    flex-direction: column;
  }
  .title-area h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    margin-top: 6px;
    width: fit-content;
    font-weight: 500;
    transition: all 0.3s;
  }
  .status-badge.preview {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .status-badge.active {
    background: var(--primary-light);
    color: var(--primary);
  }

  /* 班级切换按钮 */
  .class-switch {
    position: relative;
  }
  .switch-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    box-shadow: 0 2px 4px var(--shadow);
    transition: all 0.2s;
  }
  .switch-btn:active { transform: scale(0.95); }
  
  .switch-menu {
    position: absolute;
    top: 44px;
    right: 0;
    background: var(--surface);
    border-radius: 12px;
    box-shadow: 0 4px 12px var(--shadow);
    overflow: hidden;
    display: none;
    flex-direction: column;
    min-width: 120px;
    z-index: 100;
  }
  .switch-menu.open { display: flex; }
  .switch-menu div {
    padding: 12px 16px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  .switch-menu div:hover { background: var(--primary-light); }
  .switch-menu div.active { color: var(--primary); font-weight: 700; background: var(--primary-light); }

  /* 网格容器 */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    background-color: var(--grid-bg);
    padding: 6px;
    border-radius: 12px;
    width: 100%;
    max-width: 380px;
    aspect-ratio: 1 / 1;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px var(--shadow);
  }

  .mini-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 2px;
    background-color: var(--border);
    padding: 2px;
    border-radius: 4px;
  }

  /* 座位格子 */
  .seat {
    background-color: var(--surface);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 10px;
    color: var(--text-muted);
    cursor: pointer;
    position: relative;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    border-radius: 2px;
  }
  
  /* 已固定的座位 / 选好的座位 (通用高亮态) */
  .seat.filled {
    color: #FFF;
    font-weight: 700;
    font-size: 12px;
    cursor: not-allowed;
  }

  /* 选中的座位（放大状态） */
  .seat.selected {
    z-index: 50;
    transform: scale(3);
    box-shadow: 0 10px 30px var(--shadow);
    border-radius: 8px;
  }

  /* 模糊控制 */
  .blurred {
    filter: blur(6px) !important;
    pointer-events: none;
    opacity: 0.6;
  }
  .grid-container.has-selection .seat:not(.selected) {
    filter: blur(4px);
    pointer-events: none;
    opacity: 0.5;
  }

  /* 输入框弹出区 */
  .input-area {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    background: var(--surface);
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 4px 16px var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 200px;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .input-area.active {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }
  .input-area input[type="text"] {
    width: 100%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 16px;
    padding: 8px;
    border-radius: 8px;
    text-align: center;
    outline: none;
  }
  .input-area input[type="text"]:focus { border-color: var(--primary); }
  
  /* 颜色选择器容器 */
  .color-picker-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    color: var(--text-muted);
  }
  .input-area input[type="color"] {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    background: none;
    padding: 0;
  }
  .input-area input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .input-area input[type="color"]::-webkit-color-swatch { border: 2px solid var(--border); border-radius: 50%; }

  .input-area button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 15px;
  }
  .input-area button:disabled {
    background: var(--border);
    cursor: not-allowed;
  }
  .input-area .hint {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
  }

  /* 下载按钮 */
  .download-btn {
    margin-top: 24px;
    width: 100%;
    max-width: 380px;
    height: 56px;
    border-radius: 999px;
    background: var(--primary);
    color: #fff;
    border: none;
    font-size: 16px;
    font-weight: 600;
    display: none;
    justify-content: center;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.3s;
    z-index: 10;
  }
  .download-btn.show {
    display: flex;
    animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* 全屏遮罩 */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 999;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 24px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .overlay h2 { font-size: 24px; color: var(--primary); margin-bottom: 12px; }
  .overlay p { font-size: 15px; color: var(--text); line-height: 1.6; }

</style>
</head>
<body>

  <div class="top-bar" id="topBar">
    <div class="title-area">
      <h1>选座</h1>
      <div class="status-badge preview" id="statusBadge">
        <span>👀</span> <span id="statusText">仅预览</span>
      </div>
    </div>
    
    <div class="class-switch">
      <div class="switch-btn" onclick="toggleClassMenu(event)">
        <span id="currentClassName">Vetir 班</span>
        <span style="font-size: 16px;">▼</span>
      </div>
      <div class="switch-menu" id="classMenu">
        <div onclick="switchClass('v', this)">Vetir 班</div>
        <div onclick="switchClass('s', this)">Sixut 班</div>
        <div onclick="switchClass('m', this)">Midel 班</div>
      </div>
    </div>
  </div>

  <div class="grid-container" id="grid"></div>

  <button class="download-btn" id="downloadBtn" onclick="downloadSeatMap()">
    ⬇️ 下载座位表
  </button>

  <div class="overlay" id="overlay">
    <h2>已发起下载请求</h2>
    <p>请将座位表发给橒橒<br>如需查看其他座位请刷新页面</p>
  </div>

<script>
  /* =========================================================
     【数据管理区】开发者在这里修改数据和颜色
     ========================================================= */
  // 格式为：'座位号': { name: '名字', color: '#颜色' }
  const OCCUPIED_DATA = {
    'v': { 
      'D5': { name: '橒', color: '#007981' } // Vetir 班，D列 第5排
    },
    's': {}, 
    'm': {}  
  };
  
  const CLASS_DATA = {
    'v': 'Vetir 班',
    's': 'Sixut 班',
    'm': 'Midel 班'
  };
  /* ========================================================= */

  const COL_LABELS = ['I', 'H', 'G', 'F', 'E', 'D', 'C', 'B', 'A'];

  let currentClassCode = 'v';
  let selectedIndex = -1;
  let selectedLabel = '';

  window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const clutu = urlParams.get('clutu') || 'v';
    
    if (CLASS_DATA[clutu]) {
      currentClassCode = clutu;
    }
    
    updateClassUI();
    initGrid();
    updateStatus();
  };

  function updateStatus() {
    const badge = document.getElementById('statusBadge');
    const text = document.getElementById('statusText');
    
    const urlParams = new URLSearchParams(window.location.search);
    const clutu = urlParams.get('clutu');
    
    if (clutu && clutu !== currentClassCode) {
      badge.className = 'status-badge preview';
      text.textContent = '仅预览';
    } else if (Object.keys(OCCUPIED_DATA[currentClassCode]).length > 0) {
      badge.className = 'status-badge active';
      text.textContent = '可选空座';
    } else {
      badge.className = 'status-badge active';
      text.textContent = '可选空座';
    }
  }

  function toggleClassMenu(e) {
    e.stopPropagation();
    document.getElementById('classMenu').classList.toggle('open');
  }

  document.addEventListener('click', () => {
    document.getElementById('classMenu').classList.remove('open');
  });

  function switchClass(code, element) {
    document.getElementById('classMenu').classList.remove('open');
    if (selectedIndex !== -1) {
      if (!confirm("切换班级将丢失当前的选座进度，确定切换吗？")) return;
      resetState();
    }
    
    currentClassCode = code;
    updateClassUI();
    initGrid();
    updateStatus();
    
    document.querySelectorAll('.switch-menu div').forEach(el => el.classList.remove('active'));
    if(element) element.classList.add('active');
  }

  function updateClassUI() {
    document.getElementById('currentClassName').textContent = CLASS_DATA[currentClassCode];
  }

  function resetState() {
    selectedIndex = -1;
    selectedLabel = '';
    document.getElementById('grid').classList.remove('has-selection');
    document.getElementById('topBar').classList.remove('blurred');
    document.getElementById('downloadBtn').classList.remove('show');
  }

  function initGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    
    for (let blockRow = 0; blockRow < 3; blockRow++) {
      for (let blockCol = 0; blockCol < 3; blockCol++) {
        const miniGrid = document.createElement('div');
        miniGrid.className = 'mini-grid';
        
        for (let cellRow = 0; cellRow < 3; cellRow++) {
          for (let cellCol = 0; cellCol < 3; cellCol++) {
            const row = blockRow * 3 + cellRow;
            const col = blockCol * 3 + cellCol;
            
            const seat = document.createElement('div');
            seat.className = 'seat';
            
            const label = COL_LABELS[col] + (row + 1);
            seat.dataset.label = label;
            seat.dataset.index = row * 9 + col;
            
            // 检查是否是固定座位
            const data = OCCUPIED_DATA[currentClassCode][label];
            if (data) {
              seat.classList.add('filled');
              seat.textContent = data.name;
              seat.style.backgroundColor = data.color;
            } else {
              seat.textContent = label; 
              seat.onclick = () => handleSelect(row * 9 + col, label, seat);
            }
            
            miniGrid.appendChild(seat);
          }
        }
        grid.appendChild(miniGrid);
      }
    }
  }

  function handleSelect(index, label, seatElement) {
    if (selectedIndex !== -1) return;

    selectedIndex = index;
    selectedLabel = label;
    
    // 设置初始颜色为默认主题蓝
    seatElement.style.backgroundColor = 'var(--primary)';
    seatElement.style.color = '#FFF';
    
    seatElement.classList.add('selected');
    seatElement.textContent = ''; 
    
    document.getElementById('grid').classList.add('has-selection');
    document.getElementById('topBar').classList.add('blurred');

    const inputArea = document.createElement('div');
    inputArea.className = 'input-area';
    inputArea.innerHTML = `
      <div style="font-weight:bold;text-align:center;color:var(--text);font-size:18px;">${label}</div>
      <input type="text" id="nameInput" placeholder="输入简写" maxlength="8">
      <div class="color-picker-row">
        <span>专属颜色</span>
        <input type="color" id="colorInput" value="#1565C0">
      </div>
      <div class="hint">限4字 (中文算2字)</div>
      <button id="confirmBtn" disabled>确认位置</button>
    `;
    
    document.body.appendChild(inputArea);
    setTimeout(() => inputArea.classList.add('active'), 10);

    const input = document.getElementById('nameInput');
    const colorInput = document.getElementById('colorInput');
    const confirmBtn = document.getElementById('confirmBtn');

    // 实时预览颜色
    colorInput.addEventListener('input', (e) => {
      seatElement.style.backgroundColor = e.target.value;
    });

    // 输入验证
    input.addEventListener('input', () => {
      let val = input.value;
      let length = 0;
      for (let char of val) {
        length += /[\u4e00-\u9fa5]/.test(char) ? 2 : 1;
      }
      if (length > 4) {
        input.value = val.slice(0, -1);
      }
      length = 0;
      for (let char of input.value) {
        length += /[\u4e00-\u9fa5]/.test(char) ? 2 : 1;
      }
      confirmBtn.disabled = length === 0;
    });

    // 点击确认
    confirmBtn.onclick = () => {
      const name = input.value.trim();
      if (!name) return;

      inputArea.remove();
      
      // 1. 取消模糊和放大状态
      document.getElementById('grid').classList.remove('has-selection');
      seatElement.classList.remove('selected');
      
      // 2. 变成已填充状态
      seatElement.classList.add('filled');
      seatElement.textContent = name;
      
      // 3. 恢复顶部
      document.getElementById('topBar').classList.remove('blurred');
      document.getElementById('downloadBtn').classList.add('show');
    };
  }

  function downloadSeatMap() {
    document.getElementById('overlay').classList.add('active');
    setTimeout(() => {
      generateAndDownloadPNG();
    }, 500);
  }

  // Canvas 绘制
  function generateAndDownloadPNG() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const size = 1000;
    canvas.width = size;
    canvas.height = size;
    
    ctx.fillStyle = '#F4F8FF';
    ctx.fillRect(0, 0, size, size);
    
    ctx.fillStyle = '#1A1C1E';
    ctx.font = 'bold 40px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${CLASS_DATA[currentClassCode]} 座位表`, size/2, 80);

    const gridStartX = 100;
    const gridStartY = 150;
    const cellSize = 80;
    const blockGap = 10;
    const cellGap = 4;
    const blockSize = cellSize * 3 + cellGap * 2; 

    for (let blockRow = 0; blockRow < 3; blockRow++) {
      for (let blockCol = 0; blockCol < 3; blockCol++) {
        
        ctx.fillStyle = '#CBD5E1';
        const bgX = gridStartX + blockCol * (blockSize + blockGap);
        const bgY = gridStartY + blockRow * (blockSize + blockGap);
        ctx.beginPath();
        ctx.roundRect(bgX, bgY, blockSize, blockSize, 8);
        ctx.fill();

        for (let cellRow = 0; cellRow < 3; cellRow++) {
          for (let cellCol = 0; cellCol < 3; cellCol++) {
            const row = blockRow * 3 + cellRow;
            const col = blockCol * 3 + cellCol;
            const label = COL_LABELS[col] + (row + 1);
            
            const x = bgX + 4 + cellCol * (cellSize + cellGap);
            const y = bgY + 4 + cellRow * (cellSize + cellGap);
            
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.roundRect(x, y, cellSize, cellSize, 4);
            ctx.fill();

            // 获取当前格子的DOM元素来取颜色
            const domSeat = document.querySelector(`.seat[data-label="${label}"]`);

            if (domSeat.classList.contains('filled')) {
              // 已经确定的座位（包括提前配置的和刚刚选的）
              const computedColor = getComputedStyle(domSeat).backgroundColor;
              
              ctx.fillStyle = computedColor;
              ctx.beginPath();
              ctx.roundRect(x, y, cellSize, cellSize, 4);
              ctx.fill();
              
              ctx.fillStyle = '#FFFFFF';
              ctx.font = 'bold 24px "Noto Sans SC", sans-serif';
              ctx.fillText(domSeat.textContent, x + cellSize/2, y + cellSize/2);
              
            } else {
              // 空座位
              ctx.fillStyle = '#94A3B8';
              ctx.font = '16px "Noto Sans SC", sans-serif';
              ctx.fillText(label, x + cellSize/2, y + cellSize/2);
            }
          }
        }
      }
    }
    
    const link = document.createElement('a');
    link.download = `${CLASS_DATA[currentClassCode]}_座位表.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>
</body>
</html>
