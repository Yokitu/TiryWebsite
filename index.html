<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tiry 团队介绍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="preload" as="image" href="https://cloudflareimg.cdn.sn/i/6acb9606406df_1791727110.png" fetchpriority="high">
<link rel="preload" as="image" href="https://img.scdn.io/i/6acb97a301667_1791727523.webp">
<link rel="preload" as="image" href="https://img.scdn.io/i/6acb972f6f781_1791727407.webp">
<style>
:root {
  --primary: #00696E; --on-primary: #FFFFFF; --primary-container: #9CF1F6; --on-primary-container: #002022;
  --secondary: #4D6263; --secondary-container: #CCE8E9; --on-secondary-container: #051F20;
  --surface: #F4FBFB; --surface-container-low: #EEF5F5; --surface-container: #E8EFEF;
  --surface-container-high: #E2EAEA; --surface-container-highest: #DDE4E4;
  --on-surface: #161D1D; --on-surface-variant: #3F4948; --outline: #6F7979; --outline-variant: #BEC8C8;
  --shadow: rgba(0,0,0,0.15);
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #83D4D8; --on-primary: #063639; --primary-container: #0B4F52; --on-primary-container: #9FF0F5;
    --secondary: #B3CBCC; --secondary-container: #354A4C; --on-secondary-container: #CFE7E8;
    --surface: #0D1515; --surface-container-low: #161D1D; --surface-container: #1A2121;
    --surface-container-high: #252B2B; --surface-container-highest: #2F3636;
    --on-surface: #DCE4E4; --on-surface-variant: #B7CACB; --outline: #819495; --outline-variant: #394A4B;
    --shadow: rgba(0,0,0,0.5);
  }
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; font-family:'Roboto', system-ui, -apple-system, sans-serif; background: var(--surface); color: var(--on-surface); overflow:hidden; }
body { display:flex; justify-content:center; align-items:center; }

/* 手机框架模拟 */
#app-frame { width: 412px; height: 892px; max-height: 100vh; background: var(--surface); position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 40px var(--shadow); }
@media (max-width: 412px), (max-height: 892px) { #app-frame { width:100vw; height:100vh; max-height:100vh; } }

.screen-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 16px; -webkit-overflow-scrolling: touch; }
.screen-scroll::-webkit-scrollbar { width: 3px; }
.screen-scroll::-webkit-scrollbar-thumb { background: var(--outline-variant); border-radius: 2px; }

.btn { height: 56px; min-height: 56px; padding: 0 24px; border-radius: 28px; border: none; font-family: inherit; font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all 0.15s; white-space: nowrap; text-decoration: none; }
.btn .material-symbols-rounded { font-size: 20px; }
.btn-outlined { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
.btn-outlined:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); }
.btn-outlined:active { transform: scale(0.97); }
.btn.wide { width: 380px; max-width: 100%; }

.card { border-radius: 20px; background: var(--surface-container-highest); overflow: hidden; display: flex; flex-direction: column; }
.card.elevated { background: var(--surface-container-low); box-shadow: 0 1px 4px var(--shadow); }
.card-body { padding: 20px; display: flex; flex-direction: column; gap: 4px; }
.card-title { font-size: 16px; font-weight: 500; color: var(--on-surface); }
.card-text { font-size: 14px; color: var(--on-surface-variant); line-height: 1.5; }

.carousel { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
.carousel::-webkit-scrollbar { display: none; }
.carousel-card { flex-shrink: 0; border-radius: 16px; background: var(--surface-container-high); overflow: hidden; scroll-snap-align: start; display: flex; flex-direction: column; position: relative; }
.carousel-card .cc-img { flex: 1; background: var(--surface-container-highest); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.carousel-card .cc-img img { width: 100%; height: 100%; object-fit: cover; }
.carousel-card .cc-title { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 16px; font-size: 16px; font-weight: 500; color: var(--on-surface); background: linear-gradient(transparent, var(--surface-container-high)); }

.section-title { font-size: 28px; color: var(--on-surface); padding: 16px 16px 8px; }

.img-box { position: relative; overflow: hidden; background: var(--surface-container-highest); }
.img-box::after { content: ''; position: absolute; inset: 0; background: var(--surface-container-highest); opacity: 1; transition: opacity 0.35s ease; pointer-events: none; }
.img-box.loaded::after { opacity: 0; }
.img-box img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.35s ease; }
.img-box.loaded img { opacity: 1; }
.img-box.logo-box img { object-fit: contain; padding: 12px; background: var(--surface-container-highest); }

.material-symbols-rounded { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none; line-height: 1; display: inline-block; }
</style>
</head>
<body>
<div id="app-frame">
  <div class="screen-scroll">
    <!-- 顶部介绍卡片 -->
    <div style="padding:16px">
      <div class="card elevated" style="height:292px">
        <div class="img-box logo-box" style="height:192px;width:100%">
          <img src="https://cloudflareimg.cdn.sn/i/6acb9606406df_1791727110.png" alt="Tiry" fetchpriority="high" decoding="async">
        </div>
        <div class="card-body">
          <div class="card-title">欢迎来到Tiry的主页</div>
          <div class="card-text">Tiry是一群初中生们自己的团队</div>
        </div>
      </div>
    </div>

    <!-- Slogan -->
    <div style="text-align:center;padding:8px 16px;font-size:16px;color:var(--on-surface-variant)">
      探索，开发，学习，互助……：Tiry存在的意义
    </div>

    <!-- 开发者轮播 -->
    <div class="section-title">开发者</div>
    <div class="carousel">
      <div class="carousel-card" style="width:260px;height:216px">
        <div class="cc-img img-box">
          <img src="https://img.scdn.io/i/6acb97a301667_1791727523.webp" alt="天边橒" fetchpriority="high" decoding="async">
        </div>
        <div class="cc-title">天边橒（团长）</div>
      </div>
      <div class="carousel-card" style="width:260px;height:216px">
        <div class="cc-img img-box">
          <img src="https://img.scdn.io/i/6acb972f6f781_1791727407.webp" alt="Jidurt" fetchpriority="high" decoding="async">
        </div>
        <div class="cc-title">Jidurt</div>
      </div>
    </div>

    <!-- 其他成员轮播 -->
    <div class="section-title">其他成员</div>
    <div class="carousel">
      <div class="carousel-card" style="width:220px;height:228px">
        <div class="cc-img img-box">
          <img src="https://img.scdn.io/i/6acb96b258c5b_1791727282.webp" alt="冉欣妍" loading="lazy" decoding="async">
        </div>
        <div class="cc-title">冉欣妍·ꦿ໊ོr.lin</div>
      </div>
      <div class="carousel-card" style="width:220px;height:228px">
        <div class="cc-img img-box">
          <img src="https://img.scdn.io/i/6acb9654c7c4b_1791727188.webp" alt="请输入文本" loading="lazy" decoding="async">
        </div>
        <div class="cc-title">请输入文本</div>
      </div>
      <div class="carousel-card" style="width:220px;height:228px">
        <div class="cc-img img-box">
          <img src="https://img.scdn.io/i/6acb967fc6981_1791727231.webp" alt="Sky双叶" loading="lazy" decoding="async">
        </div>
        <div class="cc-title">Sky双叶</div>
      </div>
    </div>

    <!-- 底部按钮区 -->
    <div style="padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center; margin-top: 8px;">
      <!-- 这里的链接我暂时写成了 `#`，你可以改成实际的项目网址 -->
      <a href="#" class="btn btn-outlined wide">
        <span class="material-symbols-rounded">arrow_forward</span>来看看我们的项目：TiryHi
      </a>
      <a href="#" class="btn btn-outlined wide">
        <span class="material-symbols-rounded">chat</span>联系我们
      </a>
    </div>

    <!-- 底部文字 -->
    <div style="text-align:center;padding:8px 16px 24px;font-size:16px;color:var(--on-surface-variant)">
      Tiry主页
    </div>
  </div>
</div>

<script>
// 简单的图片加载淡入效果
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.img-box img').forEach(img => {
    const box = img.parentElement;
    if (!box) return;
    if (img.complete && img.naturalWidth > 0) {
      box.classList.add('loaded');
    } else {
      img.addEventListener('load', () => box.classList.add('loaded'), { once: true });
      img.addEventListener('error', () => box.classList.add('loaded'), { once: true });
    }
  });
});
</script>
</body>
</html>
