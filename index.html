.avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-box { position: relative; overflow: hidden; background: var(--surface-container-highest); }
.img-box::after { content: ''; position: absolute; inset: 0; background: var(--surface-container-highest); opacity: 1; transition: opacity 0.35s ease; pointer-events: none; }
.img-box.loaded::after { opacity: 0; }
.img-box img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.35s ease; }
.img-box.loaded img { opacity: 1; }
.img-box.logo-box img { object-fit: contain; padding: 12px; background: var(--surface-container-highest); }
.checkbox-row { display: flex; align-items: center; gap: 12px; padding: 8px 4px; cursor: pointer; user-select: none; }
.checkbox-row input[type="checkbox"] { display: none; }
.checkbox-box { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--outline); display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
.checkbox-row input:checked + .checkbox-box { background: var(--primary); border-color: var(--primary); }
.checkbox-box .material-symbols-rounded { font-size: 16px; color: var(--on-primary); opacity: 0; transition: opacity 0.15s; }
.checkbox-row input:checked + .checkbox-box .material-symbols-rounded { opacity: 1; }
.checkbox-label { font-size: 15px; color: var(--on-surface); }
.remember-row { display: flex; align-items: center; gap: 8px; background: var(--surface-container-low); border-radius: 16px; padding: 8px 12px; }
.remember-row .checkbox-row { flex: 1; padding: 4px; }
</style>
</head>
<body>
<div id="app-frame">
  <div id="screens"></div>
  <div class="snackbar-host" id="snackbar-host"></div>
  <div class="dialog-scrim" id="dialog-scrim"></div>
</div>
<script>
'use strict';

const IMG = {
  tiryIcon:   'https://img.scdn.io/i/6ad0c7aa5bff2_1792067498.png',
  tiryLogo:   'https://cloudflareimg.cdn.sn/i/6acb9606406df_1791727110.png',
  jidurt:     'https://img.scdn.io/i/6acb972f6f781_1791727407.webp',
  tianbianyun:'https://img.scdn.io/i/6acb97a301667_1791727523.webp',
  ranxinyan:  'https://img.scdn.io/i/6acb96b258c5b_1791727282.webp',
  qingshu:    'https://img.scdn.io/i/6acb9654c7c4b_1791727188.webp',
  sky:        'https://img.scdn.io/i/6acb967fc6981_1791727231.webp'
};

const VERIFY_CODE = 'Rayo99Yog6DB';

const DB_NAME = 'tiryhi_db';
const DB_VERSION = 1;
const STORES = ['counters', 'anniversaries', 'intents', 'browserPages', 'settings'];
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      for (const name of STORES) {
        if (!db.objectStoreNames.contains(name)) {
          db.createObjectStore(name, { keyPath: 'id', autoIncrement: name !== 'settings' });
        }
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
function dbGetAll(store) {
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const r = tx.objectStore(store).getAll();
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
function dbPut(store, value) {
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    const r = tx.objectStore(store).put(value);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
function dbAdd(store, value) {
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    const r = tx.objectStore(store).add(value);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
function dbDelete(store, id) {
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    const r = tx.objectStore(store).delete(id);
    r.onsuccess = () => res(); r.onerror = () => rej(r.error);
  }));
}
function getSetting(key, def = null) {
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction('settings', 'readonly');
    const r = tx.objectStore('settings').get(key);
    r.onsuccess = () => res(r.result ? r.result.value : def);
    r.onerror = () => rej(r.error);
  }));
}
function setSetting(key, value) {
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction('settings', 'readwrite');
    const r = tx.objectStore('settings').put({ id: key, value });
    r.onsuccess = () => res(); r.onerror = () => rej(r.error);
  }));
}

function icon(name, opts = {}) {
  const cls = opts.filled ? 'material-symbols-rounded filled' : 'material-symbols-rounded';
  const style = (opts.size ? `font-size:${opts.size}px;` : '') + (opts.color ? `color:${opts.color};` : '');
  return `<span class="${cls}" style="${style}">${name}</span>`;
}

const state = {
  currentScreen: null,
  history: [],
  animating: false,
  counters: [],
  anniversaries: [],
  intents: [],
  browserPages: [],
  settings: {},
  editingIntentId: null,
  editingAnniversaryId: null,
  editingBrowserPageId: null,
  editingCounterId: null,
  viewingAnniversaryId: null,
};

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}/${m}/${day}`;
}
function parseDate(s) {
  const parts = s.split('/').map(Number);
  return new Date(parts[0], parts[1]-1, parts[2]);
}
function daysBetween(a, b) {
  const ms = 24*60*60*1000;
  return Math.round((b - a) / ms);
}
function getAnniversaryInfo(dateStr) {
  const date = parseDate(dateStr);
  const today = new Date(); today.setHours(0,0,0,0);
  let years = today.getFullYear() - date.getFullYear();
  if (years < 0) years = 0;
  let next = new Date(today.getFullYear(), date.getMonth(), date.getDate());
  if (next < today) next = new Date(today.getFullYear()+1, date.getMonth(), date.getDate());
  const daysLeft = daysBetween(today, next);
  return { years, daysLeft, next };
}

function showSnackbar(text, actionLabel, actionFn) {
  const host = document.getElementById('snackbar-host');
  const el = document.createElement('div');
  el.className = 'snackbar';
  el.innerHTML = `<span class="snackbar-text">${esc(text)}</span>`;
  if (actionLabel) {
    const btn = document.createElement('button');
    btn.className = 'snackbar-action';
    btn.textContent = actionLabel;
    btn.onclick = () => { if (actionFn) actionFn(); removeSnackbar(el); };
    el.appendChild(btn);
  }
  host.appendChild(el);
  setTimeout(() => removeSnackbar(el), 4000);
}
function removeSnackbar(el) {
  if (!el.parentNode) return;
  el.classList.add('removing');
  setTimeout(() => el.remove(), 200);
}

function confirmDialog(title, text, confirmLabel, onConfirm) {
  const scrim = document.getElementById('dialog-scrim');
  scrim.innerHTML = `
    <div class="dialog">
      <div class="dialog-title">${esc(title)}</div>
      <div class="dialog-text">${esc(text)}</div>
      <div class="dialog-actions">
        <button class="btn btn-text" id="dlg-cancel">取消</button>
        <button class="btn btn-filled" id="dlg-confirm">${esc(confirmLabel || '确定')}</button>
      </div>
    </div>`;
  scrim.classList.add('open');
  const close = () => { scrim.classList.remove('open'); scrim.innerHTML = ''; };
  scrim.querySelector('#dlg-cancel').onclick = close;
  scrim.querySelector('#dlg-confirm').onclick = () => { close(); if (onConfirm) onConfirm(); };
  scrim.onclick = (e) => { if (e.target === scrim) close(); };
}

function copyText(text, label) {
  const done = () => showSnackbar(`已复制${label ? '：'+label : ''}`);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  if (done) done();
}
function openExternal(url) {
  window.open(url, '_blank', 'noopener');
}

function appBar({ title, back, actions = [] }) {
  const left = back ? `<button class="icon-btn" data-back>${icon('arrow_back')}</button>` : '<div style="width:4px"></div>';
  const right = actions.map(a => `<button class="icon-btn" data-action="${a.id}" id="${a.id}">${icon(a.icon)}</button>`).join('');
  return `<header class="app-bar" data-appbar>
    ${left}
    <h1 class="app-bar-title">${esc(title)}</h1>
    ${right}
  </header>`;
}
function listItem({ title, sub, iconName, iconStyle = '', avatar = '', trailing = 'chevron_right', trailingIcon = 'chevron_right', bg = '', dataAttrs = '', id = '', disabled = false }) {
  let iconHtml = '';
  if (avatar) {
    iconHtml = `<div class="list-item-icon ${iconStyle}"><span class="img-box" style="display:block;width:100%;height:100%"><img class="avatar-img" src="${esc(avatar)}" alt="" loading="lazy" decoding="async"></span></div>`;
  } else if (iconName) {
    iconHtml = `<div class="list-item-icon ${iconStyle}">${icon(iconName)}</div>`;
  }
  const trailHtml = trailing === false ? '' : `<div class="list-item-trailing">${icon(trailingIcon)}</div>`;
  return `<button class="list-item ${bg} ${disabled ? 'disabled' : ''}" ${dataAttrs} ${id ? `id="${id}"` : ''}>
    ${iconHtml}
    <div class="list-item-content">
      <div class="list-item-title">${esc(title)}</div>
      ${sub ? `<div class="list-item-sub">${esc(sub)}</div>` : ''}
    </div>
    ${trailHtml}
  </button>`;
}
function wavyProgress(pct) {
  return `<div class="progress-wavy">
    <svg viewBox="0 0 400 16" preserveAspectRatio="none">
      <rect x="0" y="0" width="400" height="16" rx="8" class="wave-bg"/>
      <rect x="0" y="0" width="${400*pct/100}" height="16" rx="8" class="wave-fg"/>
    </svg>
  </div>`;
}

function attachLongPress(el, fn) {
  let timer = null;
  const start = (e) => {
    if (e.target.closest('[data-copy]')) return;
    timer = setTimeout(() => { timer = null; fn(); }, 550);
  };
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchmove', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
}

function showVerifyDialog() {
  const scrim = document.getElementById('dialog-scrim');
  const remember = state.settings.rememberMe !== false;
  scrim.innerHTML = `
    <div class="dialog">
      <div class="dialog-title">初步验证身份</div>
      <div class="dialog-text">输入暗号解锁全部功能，或直接登录（部分功能受限）</div>
      <div class="text-field" style="margin-bottom:8px">
        ${icon('lock','field-icon')}
        <input type="password" id="dlg-code" placeholder=" " autocomplete="off">
        <label class="field-label">暗号</label>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="dlg-remember" ${remember ? 'checked' : ''}>
        <span class="checkbox-box">${icon('check')}</span>
        <span class="checkbox-label">记住我</span>
      </label>
      <div class="dialog-actions stacked">
        <button class="btn btn-filled" id="dlg-unlock">开始吧</button>
        <button class="btn btn-tonal" id="dlg-direct">直接登录</button>
      </div>
    </div>`;
  scrim.classList.add('open');
  const close = () => { scrim.classList.remove('open'); scrim.innerHTML = ''; };
  scrim.onclick = (e) => { if (e.target === scrim) close(); };
  const input = scrim.querySelector('#dlg-code');
  setTimeout(() => input?.focus(), 50);
  const getRemember = () => scrim.querySelector('#dlg-remember')?.checked !== false;

  const unlock = async () => {
    const val = input.value.trim();
    if (!val) { showSnackbar('请输入暗号，或选择直接登录'); return; }
    if (val !== VERIFY_CODE) { showSnackbar('暗号不正确'); return; }
    const rem = getRemember();
    await setSetting('verified', true);
    await setSetting('rememberMe', rem);
    await setSetting('directLogin', false);
    state.settings.verified = true;
    state.settings.rememberMe = rem;
    state.settings.directLogin = false;
    close();
    showSnackbar('验证通过，已解锁全部功能');
    navigateTo('home', { replace: true });
  };

  const direct = async () => {
    const rem = getRemember();
    await setSetting('verified', true);
    await setSetting('rememberMe', rem);
    await setSetting('directLogin', true);
    state.settings.verified = true;
    state.settings.rememberMe = rem;
    state.settings.directLogin = true;
    close();
    showSnackbar('已直接登录（浏览器与 Intent 不可用）');
    navigateTo('home', { replace: true });
  };

  scrim.querySelector('#dlg-unlock').onclick = unlock;
  scrim.querySelector('#dlg-direct').onclick = direct;
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
}

const R = {};

R.home = () => {
  const direct = state.settings.directLogin === true;
  return `
  ${appBar({ title: 'TiryHi' })}
  <div class="screen-scroll">
    <h2 class="section-title">常用</h2>
    <div class="list-group">
      ${listItem({ title:'倒计日', iconName:'calendar_month', dataAttrs:'data-nav="countdown"' })}
      ${listItem({ title:'计数器', iconName:'counter_6', dataAttrs:'data-nav="counter"' })}
      ${listItem({ title:'浏览器', iconName:'language', dataAttrs: direct ? 'data-blocked="浏览器"' : 'data-nav="browser"', disabled: direct })}
      ${listItem({ title:'Intent', iconName:'open_in_new', dataAttrs: direct ? 'data-blocked="Intent"' : 'data-nav="shell"', disabled: direct })}
      ${listItem({ title:'设置', iconName:'settings', dataAttrs:'data-nav="settings"' })}
    </div>
    ${direct ? `<div style="padding:16px;font-size:13px;color:var(--on-surface-variant);text-align:center">直接登录模式下，浏览器与 Intent 不可用</div>` : ''}
  </div>`;
};

R.countdown = () => {
  const items = state.anniversaries.length ? state.anniversaries.map(a => {
    const info = getAnniversaryInfo(a.date);
    const display = a.name
      ? `${a.name}•${a.title}•${a.date}`
      : `${a.title}•${a.date}`;
    return listItem({
      title: display,
      sub: `${info.years}周年•还剩${info.daysLeft}天`,
      iconName: 'calendar_month',
      dataAttrs: `data-nav-anniversary="${a.id}"`
    });
  }).join('') : `<div class="empty-state">
      ${icon('calendar_month')}
      <div class="empty-title">暂无纪念日</div>
      <div class="empty-text">点击右下角按钮添加你的第一个纪念日</div>
    </div>`;
  return `
    ${appBar({ title:'倒计日', back:true })}
    <div class="screen-scroll">
      <div class="list-group" style="margin-top:8px">${items}</div>
    </div>
    <div class="fab-container"><button class="fab" data-fab-add-anniversary>${icon('add')}</button></div>`;
};

R.counter = () => {
  const boxes = state.counters.length ? state.counters.map(c => `
    <div class="container-box" style="margin-top:16px" data-counter-id="${c.id}">
      <div class="cb-title">${esc(c.title || '计数器')}</div>
      <div class="cb-number" data-counter-num="${c.id}">${c.value}</div>
      <div class="cb-actions">
        <button class="icon-btn" data-counter-reset="${c.id}">${icon('refresh')}</button>
        <button class="icon-btn" data-counter-edit="${c.id}">${icon('edit')}</button>
        <button class="icon-btn" data-counter-sub="${c.id}">${icon('remove')}</button>
        <button class="icon-btn" data-counter-add="${c.id}">${icon('add')}</button>
      </div>
    </div>
    <div class="row pad" style="margin-top:12px">
      <div class="text-field" style="flex:1">
        ${icon('add','field-icon')}
        <input type="number" inputmode="numeric" placeholder=" " data-counter-input="${c.id}" value="${c.step||1}">
        <label class="field-label">输入加数</label>
      </div>
      <button class="icon-btn tonal" data-counter-plus="${c.id}">${icon('add')}</button>
    </div>
    <div class="divider"></div>
  `).join('') : `<div class="empty-state" style="margin-top:24px">
      ${icon('counter_6')}
      <div class="empty-title">暂无计数器</div>
      <div class="empty-text">点击右上角加号添加</div>
    </div>`;
  return `
    ${appBar({ title:'计数器', back:true, actions:[{id:'add-counter', icon:'add'}] })}
    <div class="screen-scroll">${boxes}</div>`;
};

R.counterEdit = () => {
  const c = state.editingCounterId ? state.counters.find(x=>x.id===state.editingCounterId) : null;
  return `
    ${appBar({ title:'编辑计数器', back:true, actions:[{id:'counter-delete', icon:'delete'}] })}
    <div class="screen-scroll">
      <div class="content-pad" style="display:flex;flex-direction:column;gap:16px;margin-top:8px">
        <div class="text-field">
          ${icon('title','field-icon')}
          <input type="text" id="ce-title" placeholder=" " value="${c?esc(c.title):''}">
          <label class="field-label">标题</label>
        </div>
        <div class="text-field">
          ${icon('numbers','field-icon')}
          <input type="number" id="ce-value" placeholder=" " value="${c?c.value:0}">
          <label class="field-label">当前数值</label>
        </div>
        <div class="text-field">
          ${icon('add','field-icon')}
          <input type="number" id="ce-step" placeholder=" " value="${c?c.step:1}">
          <label class="field-label">步长</label>
        </div>
      </div>
    </div>
    <div class="fab-container"><button class="fab" data-save-counter>${icon('check')}</button></div>`;
};

R.browser = () => {
  const pages = state.browserPages.length ? state.browserPages.map(p => {
    const isWelfare = p.url && p.url.includes('yoyo.luxifakj.cn');
    return listItem({
      title: p.title,
      sub: p.url,
      iconName: 'language',
      iconStyle: isWelfare ? 'plain' : '',
      bg: isWelfare ? 'solid-secondary' : '',
      dataAttrs: `data-browser-page="${p.id}"`
    });
  }).join('') : `<div class="empty-state">
      ${icon('language')}
      <div class="empty-title">暂无页面</div>
      <div class="empty-text">点击右下角按钮添加</div>
    </div>`;
  return `
    ${appBar({ title:'浏览器', back:true, actions:[{id:'browser-search', icon:'search'}] })}
    <div class="screen-scroll">
      <div style="padding:8px 0 4px">
        <div class="search-bar" data-browser-searchbar>
          ${icon('search')}
          <input type="text" placeholder="搜索" readonly>
        </div>
      </div>
      <div class="list-group" style="margin-top:8px">${pages}</div>
      <div style="padding:16px;font-size:13px;color:var(--on-surface-variant);text-align:center">长按列表项可编辑</div>
    </div>
    <div class="fab-container"><button class="fab" data-fab-add-browser>${icon('add')}</button></div>`;
};

R.shell = () => {
  const items = state.intents.length ? state.intents.map(it => listItem({
    title: it.title,
    sub: it.cmd,
    iconName: 'code',
    dataAttrs: `data-intent="${it.id}"`
  })).join('') : `<div class="empty-state">
      ${icon('code')}
      <div class="empty-title">暂无Intent</div>
      <div class="empty-text">点击右下角按钮添加</div>
    </div>`;
  return `
    ${appBar({ title:'Intent', back:true })}
    <div class="screen-scroll">
      <div class="list-group" style="margin-top:8px">${items}</div>
      <div style="padding:16px;font-size:13px;color:var(--on-surface-variant);text-align:center">长按列表项可编辑</div>
    </div>
    <div class="fab-container"><button class="fab" data-fab-create-intent>${icon('add')}</button></div>`;
};

R.settings = () => `
  ${appBar({ title:'设置', back:true })}
  <div class="screen-scroll">
    <div class="list-group" style="margin-top:8px">
      ${listItem({ title:'账号', sub:'查看账号信息', iconName:'person', dataAttrs:'data-nav="account"' })}
      ${listItem({ title:'显示与风格', sub:'主题色、暗色模式等', iconName:'brightness_7', dataAttrs:'data-nav="display"' })}
      ${listItem({ title:'福利群', sub:'显示福利选项', iconName:'redeem', dataAttrs:'data-nav="welfare"' })}
      ${listItem({ title:'默认行为', sub:'浏览器、启动页、记住我', iconName:'language', dataAttrs:'data-nav="browserSettings"' })}
      ${listItem({ title:'关于我们', sub:'TiryHi v1.4 Beta 2', iconName:'info', dataAttrs:'data-nav="about"' })}
    </div>
  </div>`;

R.account = () => `
  ${appBar({ title:'账号', back:true })}
  <div class="screen-scroll" style="display:flex;flex-direction:column">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;min-height:400px">
      <div class="text-h1">网页端无法登录</div>
    </div>
    <div style="padding:16px;display:flex;justify-content:center">
      <button class="btn btn-tonal wide" data-logout>退出登录</button>
    </div>
  </div>`;

function renderScreen(name) {
  const fn = R[name];
  const content = fn ? fn() : '';
  return `<div class="screen" data-screen="${name}">${content}</div>`;
}
function navigateTo(name, opts = {}) {
  if (state.animating) return;
  const screensEl = document.getElementById('screens');
  const current = screensEl.querySelector('.screen.active');
  if (current && current.dataset.screen === name && !opts.force) return;
  state.animating = true;
  const newEl = document.createElement('div');
  newEl.innerHTML = renderScreen(name);
  const newScreen = newEl.firstElementChild;
  if (current && !opts.replace) {
    if (opts.reverse) {
      newScreen.classList.add('anim-in-left');
      current.classList.add('anim-out-right');
    } else {
      newScreen.classList.add('anim-in-right');
      current.classList.add('anim-out-left');
    }
    screensEl.appendChild(newScreen);
    newScreen.classList.add('active');
    const old = current;
    setTimeout(() => {
      old.remove();
      newScreen.classList.remove('anim-in-right','anim-in-left','anim-out-right','anim-out-left');
      state.animating = false;
    }, 400);
  } else {
    if (current) current.remove();
    screensEl.appendChild(newScreen);
    newScreen.classList.add('active');
    state.animating = false;
  }
  state.currentScreen = name;
  if (!opts.noHistory) {
    if (opts.replace) {
      state.history[state.history.length - 1] = name;
    } else if (opts.reverse) {
      state.history.pop();
    } else {
      state.history.push(name);
    }
  }
  bindScreenEvents(newScreen, name);
  setupScrollListener(newScreen);
}
function goBack() {
  if (state.animating) return;
  if (state.history.length <= 1) {
    showSnackbar('已经在首页');
    return;
  }
  const screensEl = document.getElementById('screens');
  const current = screensEl.querySelector('.screen.active');
  if (!current) return;
  state.history.pop();
  const prev = state.history[state.history.length - 1];
  state.animating = true;
  const newEl = document.createElement('div');
  newEl.innerHTML = renderScreen(prev);
  const newScreen = newEl.firstElementChild;
  screensEl.appendChild(newScreen);
  newScreen.classList.add('active','anim-in-left');
  current.classList.add('anim-out-right');
  state.currentScreen = prev;
  const old = current;
  setTimeout(() => {
    old.remove();
    newScreen.classList.remove('anim-in-left','anim-out-right');
    state.animating = false;
  }, 400);
  bindScreenEvents(newScreen, prev);
  setupScrollListener(newScreen);
}
function rerender(name) {
  const screensEl = document.getElementById('screens');
  const current = screensEl.querySelector('.screen.active');
  if (!current) return;
  const el = document.createElement('div');
  el.innerHTML = renderScreen(name);
  const newScreen = el.firstElementChild;
  newScreen.classList.add('active');
  screensEl.appendChild(newScreen);
  current.remove();
  bindScreenEvents(newScreen, name);
  setupScrollListener(newScreen);
}
function setupScrollListener(screenEl) {
  const scroll = screenEl.querySelector('.screen-scroll');
  if (!scroll) return;
  const appbar = screenEl.querySelector('[data-appbar]');
  scroll.addEventListener('scroll', () => {
    if (appbar) appbar.classList.toggle('scrolled', scroll.scrollTop > 8);
  }, { passive: true });
  screenEl.querySelectorAll('.img-box img').forEach(img => {
    const box = img.parentElement;
    if (!box) return;
    if (img.complete && img.naturalWidth > 0) box.classList.add('loaded');
    else {
      img.addEventListener('load', () => box.classList.add('loaded'), { once: true });

function runIntent(it) {
  const cmd = (it.cmd || '').trim();
  let m = cmd.match(/^tiry:\/\/nav\/([a-zA-Z]+)$/);
  if (m) {
    const target = m[1];
    if (R[target]) { navigateTo(target); return; }
    showSnackbar('未知页面：' + target);
    return;
  }
  m = cmd.match(/^tiry:\/\/open\/(.+)$/);
  if (m) { openExternal(decodeURIComponent(m[1])); return; }
  if (/^intent:/i.test(cmd) || (/^[a-z][a-z0-9+.-]*:\/\//i.test(cmd) && !/^https?:\/\//i.test(cmd))) {
    try { window.location.href = cmd; }
    catch(e) { showSnackbar('无法启动：' + cmd); }
    return;
  }
  if (/^https?:\/\//i.test(cmd)) { openExternal(cmd); return; }
  state.editingIntentId = it.id;
  navigateTo('intentEdit');
}

function bindSliders(el) {
  el.querySelectorAll('.slider-wrap').forEach(wrap => {
    const input = wrap.querySelector('input[type=range]');
    const fill = wrap.querySelector('.slider-fill');
    const thumb = wrap.querySelector('.slider-thumb');
    if (!input) return;
    const key = wrap.dataset.slider;
    const max = Number(input.max) || 7;
    const update = () => {
      const val = Number(input.value);
      const pct = (val / max) * 100;
      fill.style.width = pct + '%';
      thumb.style.left = pct + '%';
      const valEl = el.querySelector(`[data-slider-val="${key}"]`);
      if (valEl) valEl.textContent = val;
    };
    input.addEventListener('input', update);
    input.addEventListener('change', async () => {
      if (key === 'welfareNormal' || key === 'welfareEvening') {
        const n = Number(el.querySelector('[data-slider="welfareNormal"] input').value);
        const e2 = Number(el.querySelector('[data-slider="welfareEvening"] input').value);
        if (n + e2 > 7) showSnackbar('正常打卡+晚间打卡不能超过7');
      }
      if (key === 'welfareMakeup' && Number(input.value) > 7) {
        showSnackbar('补卡不能超过7');
      }
      await setSetting(key, Number(input.value));
      state.settings[key] = Number(input.value);
      const n = Number(el.querySelector('[data-slider="welfareNormal"] input')?.value || 0);
      const e2 = Number(el.querySelector('[data-slider="welfareEvening"] input')?.value || 0);
      const m = Number(el.querySelector('[data-slider="welfareMakeup"] input')?.value || 0);
      const rawPrize = n + e2*0.8 + m*0.1;
      const displayPrize = Math.min(7, rawPrize);
      const pct = Math.min(100, (rawPrize / 7) * 100);
      await setSetting('welfarePrize', displayPrize);
      await setSetting('welfareProgress', Math.round(pct));
      const prizeEl = el.querySelector('[data-prize]');
      if (prizeEl) prizeEl.textContent = displayPrize.toFixed(1);
      const wavy = el.querySelector('.progress-wavy rect.wave-fg');
      if (wavy) wavy.setAttribute('width', String(400 * pct / 100));
    });
    update();
  });
}

function initDatePicker(root) {
  const container = root.querySelector('#datepicker');
  if (!container) return;
  const a = state.editingAnniversaryId ? state.anniversaries.find(x=>x.id===state.editingAnniversaryId) : null;
  const today = new Date();
  if (a) {
    const d = parseDate(a.date);
    dpState.year = d.getFullYear();
    dpState.month = d.getMonth();
    dpState.selected = d;
  } else {
    dpState.year = today.getFullYear();
    dpState.month = today.getMonth();
    dpState.selected = new Date(today);
  }
  renderDatePicker(container);
}
function renderDatePicker(container) {
  const { year, month, selected } = dpState;
  const first = new Date(year, month, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const weekdays = ['日','一','二','三','四','五','六'];
  let cells = '';
  for (let i = 0; i < startDay; i++) {
    const d = prevDays - startDay + 1 + i;
    cells += `<button class="dp-day other" data-day="${d}" data-month="${month-1}" data-year="${month===0?year-1:year}">${d}</button>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = (year===today.getFullYear() && month===today.getMonth() && d===today.getDate());
    const isSel = selected && selected.getFullYear()===year && selected.getMonth()===month && selected.getDate()===d;
    cells += `<button class="dp-day ${isToday?'today':''} ${isSel?'selected':''}" data-day="${d}" data-month="${month}" data-year="${year}">${d}</button>`;
  }
  const remaining = (7 - ((startDay + daysInMonth) % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    cells += `<button class="dp-day other" data-day="${i}" data-month="${month+1}" data-year="${month===11?year+1:year}">${i}</button>`;
  }
  container.innerHTML = `
    <div class="dp-header">
      <button class="icon-btn small" data-dp-prev>${icon('chevron_left')}</button>
      <span class="dp-month">${year}年${month+1}月</span>
      <button class="icon-btn small" data-dp-next>${icon('chevron_right')}</button>
    </div>
    <div class="dp-weekdays">${weekdays.map(w=>`<div class="dp-weekday">${w}</div>`).join('')}</div>
    <div class="dp-grid">${cells}</div>`;
  container.querySelector('[data-dp-prev]').onclick = () => {
    dpState.month--; if (dpState.month < 0) { dpState.month = 11; dpState.year--; }
    renderDatePicker(container);
  };
  container.querySelector('[data-dp-next]').onclick = () => {
    dpState.month++; if (dpState.month > 11) { dpState.month = 0; dpState.year++; }
    renderDatePicker(container);
  };
  container.querySelectorAll('.dp-day').forEach(btn => {
    btn.onclick = () => {
      const y = Number(btn.dataset.year), m = Number(btn.dataset.month), d = Number(btn.dataset.day);
      dpState.selected = new Date(y, m, d);
      dpState.year = y; dpState.month = m;
      renderDatePicker(container);
    };
  });
}

  '--surface-container-high':'#E2EAEA','--surface-container-highest':'#DDE4E4',
  '--on-surface':'#161D1D','--on-surface-variant':'#3F4948','--outline':'#6F7979','--outline-variant':'#BEC8C8',
  '--inverse-surface':'#2B3232','--inverse-on-surface':'#ECF2F2','--inverse-primary':'#80D5DA',
  '--error':'#B3261E','--on-error':'#FFFFFF','--error-container':'#F9DEDC','--on-error-container':'#410E0B'
};
const DARK_TOKENS = {
  '--primary':'#83D4D8','--on-primary':'#063639','--primary-container':'#0B4F52','--on-primary-container':'#9FF0F5',
  '--secondary':'#B3CBCC','--secondary-container':'#354A4C','--on-secondary-container':'#CFE7E8',
  '--tertiary-container':'#38485A','--on-tertiary-container':'#D3E4FA',
  '--surface':'#0D1515','--surface-container-low':'#161D1D','--surface-container':'#1A2121',
  '--surface-container-high':'#252B2B','--surface-container-highest':'#2F3636',
  '--on-surface':'#DCE4E4','--on-surface-variant':'#B7CACB','--outline':'#819495','--outline-variant':'#394A4B',
  '--inverse-surface':'#DCE4E4','--inverse-on-surface':'#2B3232','--inverse-primary':'#00696E',
  '--error':'#F2B8B5','--on-error':'#601410','--error-container':'#8C1D18','--on-error-container':'#F9DEDC'
};
function tokensToCSS(t) { return ':root{' + Object.entries(t).map(([k,v])=>`${k}:${v};`).join('') + '}'; }
function applyTheme() {
  const theme = state.settings.theme;
  let style = document.getElementById('theme-override');
  if (!style) { style = document.createElement('style'); style.id = 'theme-override'; document.head.appendChild(style); }
  if (theme === 'dark') { style.textContent = tokensToCSS(DARK_TOKENS); document.documentElement.style.colorScheme = 'dark'; }
  else if (theme === 'light') { style.textContent = tokensToCSS(LIGHT_TOKENS); document.documentElement.style.colorScheme = 'light'; }
  else { style.textContent = ''; document.documentElement.style.colorScheme = ''; }
}

async function init() {
  try {
    state.counters = await dbGetAll('counters');
    state.anniversaries = await dbGetAll('anniversaries');
    state.intents = await dbGetAll('intents');
    state.browserPages = await dbGetAll('browserPages');
    state.settings = {
      theme: await getSetting('theme', 'system'),
      browserBehavior: await getSetting('browserBehavior', 'newTab'),
      searchEngine: await getSetting('searchEngine', 'bing'),
      welfareNormal: await getSetting('welfareNormal', 3),
      welfareEvening: await getSetting('welfareEvening', 2),
      welfareMakeup: await getSetting('welfareMakeup', 1),
      welfareProgress: await getSetting('welfareProgress', 60),
      welfarePrize: await getSetting('welfarePrize', 0.0),
      iframeUrl: await getSetting('iframeUrl', ''),
      welcomed: await getSetting('welcomed', false),
      verified: await getSetting('verified', false),
      directLogin: await getSetting('directLogin', false),
      rememberMe: await getSetting('rememberMe', true),
      startPage: await getSetting('startPage', 'welcome'),
    };
    const seeded = await getSetting('intentsSeeded', false);
    if (!seeded) {
      const presets = [
        { title: '开发者模式', cmd: 'intent://settings#Intent;action=android.settings.APPLICATION_DEVELOPMENT_SETTINGS;end' },
        { title: '设置搜索框', cmd: 'intent://settings#Intent;action=android.settings.APP_SEARCH_SETTINGS;end' },
      ];
      for (const p of presets) {
        const id = await dbAdd('intents', p);
        p.id = id;
        state.intents.push(p);
      }
      await setSetting('intentsSeeded', true);
    }
  } catch(e) {
    console.warn('DB init failed', e);
    state.settings = { theme:'system', browserBehavior:'newTab', searchEngine:'bing',
      welfareNormal:3, welfareEvening:2, welfareMakeup:1, welfareProgress:60, welfarePrize:0,
      iframeUrl:'', welcomed:false, verified:false, directLogin:false, rememberMe:true, startPage:'start' };
  }
  applyTheme();

  let startScreen = state.settings.startPage || 'start';
  if (startScreen === 'home' && !(state.settings.rememberMe && state.settings.verified)) {
    startScreen = 'welcome';
  }

  const screensEl = document.getElementById('screens');
  const el = document.createElement('div');
  el.innerHTML = renderScreen(startScreen);
  const s = el.firstElementChild;
  s.classList.add('active');
  screensEl.appendChild(s);
  state.currentScreen = startScreen;
  state.history = [startScreen];
  bindScreenEvents(s, startScreen);
  setupScrollListener(s);

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.dropdown')) {
      document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));
      document.querySelectorAll('.dropdown-trigger.open').forEach(t => t.classList.remove('open'));
    }
  });

  history.pushState({ app: true }, '', location.href);
  window.addEventListener('popstate', () => {
    history.pushState({ app: true }, '', location.href);
    const scrim = document.getElementById('dialog-scrim');
    if (scrim.classList.contains('open')) { scrim.classList.remove('open'); scrim.innerHTML=''; return; }
    goBack();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const scrim = document.getElementById('dialog-scrim');
      if (scrim.classList.contains('open')) { scrim.classList.remove('open'); scrim.innerHTML=''; return; }
      goBack();
    }
  });
}

init();
</script>
</body>
</html>
