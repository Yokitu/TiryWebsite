<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tiry • 童友，共成长，同进步</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
  /* --- Amber 主题令牌 (Light) --- */
  :root {
    --primary: #8B5000; 
    --on-primary: #FFFFFF; 
    --primary-container: #FFDCC2; 
    --on-primary-container: #2C1600;
    --secondary: #725A44; 
    --secondary-container: #F6DFC8; 
    --on-secondary-container: #271905;
    --surface: #FFF8F5; 
    --surface-container-low: #FCF1EA; 
    --surface-container: #F7ECE4;
    --surface-container-high: #F3E6DE; 
    --surface-container-highest: #EDE0D8;
    --on-surface: #211A14; 
    --on-surface-variant: #51443B; 
    --outline: #83746A; 
    --outline-variant: #D6C3B6;
    --shadow: rgba(0,0,0,0.1);
  }
  /* --- Amber 主题令牌 (Dark) --- */
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #FDB976; 
      --on-primary: #472A07; 
      --primary-container: #683C05; 
      --on-primary-container: #FDDDC1;
      --secondary: #DEC1A8; 
      --secondary-container: #59422E; 
      --on-secondary-container: #FBDDC4;
      --surface: #17130F; 
      --surface-container-low: #1F1B18; 
      --surface-container: #231F1C;
      --surface-container-high: #2D2926; 
      --surface-container-highest: #383431;
      --on-surface: #E7E1DD; 
      --on-surface-variant: #D1C4BA; 
      --outline: #9A8F85; 
      --outline-variant: #4F453D;
      --shadow: rgba(0,0,0,0.4);
    }
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; font-family:'Roboto', system-ui, -apple-system, sans-serif; background: var(--surface-container-highest); color: var(--on-surface); overflow:hidden; }
  body { display:flex; justify-content:center; align-items:center; }
  
  /* 手机视口容器 */
  #app-frame { 
    width: 100%; max-width: 412px; height: 100%; max-height: 892px; 
    background: var(--surface); position: relative; overflow: hidden; 
    display: flex; flex-direction: column; 
    box-shadow: 0 0 40px var(--shadow); 
  }
  @media (min-width: 460px) and (min-height: 940px) {
    #app-frame { border-radius: 32px; height: 892px; }
  }
  
  .screen-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 40px; -webkit-overflow-scrolling: touch; }
  .screen-scroll::-webkit-scrollbar { width: 3px; }
  .screen-scroll::-webkit-scrollbar-thumb { background: var(--outline-variant); border-radius: 2px; }

  /* 顶部应用栏 */
  .m3e-appbar { height: 64px; display: flex; align-items: center; padding: 0 16px; background: var(--surface); position: sticky; top: 0; z-index: 10; }
  .m3e-appbar .title { font-size: 22px; font-weight: 500; margin-left: 8px; color: var(--on-surface); }

  /* M3E 按钮 */
  .btn { 
    height: 56px; padding: 0 24px; border-radius: 999px; border: none; 
    font-family: inherit; font-size: 15px; font-weight: 500; 
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
    cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); 
    text-decoration: none; width: 100%; max-width: 380px; 
  }
  .btn:active { transform: scale(0.95); }
  .btn .material-symbols-rounded { font-size: 20px; }
  .btn-filled { background: var(--primary); color: var(--on-primary); }
  .btn-outlined { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
  .btn-outlined:active { background: color-mix(in srgb, var(--primary) 8%, transparent); }

  /* 卡片 */
  .card { border-radius: 24px; background: var(--surface-container-highest); overflow: hidden; display: flex; flex-direction: column; }
  .card.elevated { background: var(--surface-container-low); box-shadow: 0 2px 8px var(--shadow); }
  .card-body { padding: 20px; display: flex; flex-direction: column; gap: 6px; }
  .card-title { font-size: 18px; font-weight: 600; color: var(--on-surface); }
  .card-text { font-size: 14px; color: var(--on-surface-variant); line-height: 1.5; }

  /* 图片容器：强制 1:1 */
  .img-box { position: relative; overflow: hidden; background: var(--surface-container-highest); aspect-ratio: 1 / 1; }
  .img-box::after { content: ''; position: absolute; inset: 0; background: var(--surface-container-highest); opacity: 1; transition: opacity 0.35s ease; pointer-events: none; }
  .img-box.loaded::after { opacity: 0; }
  /* 解决头像比例：object-fit: cover 配合容器 aspect-ratio 即可完美裁切为 1:1 且不拉伸 */
  .img-box img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.35s ease; }
  .img-box.loaded img { opacity: 1; }
  
  /* 顶部 Logo 特殊处理：保留 1:1，但使用 contain 显示全貌 */
  .img-box.logo-box { background: var(--surface-container-low); }
  .img-box.logo-box img { object-fit: contain; padding: 24px; }

  /* 横向滚动列表 */
  .carousel { display: flex; gap: 12px; overflow-x: auto; padding: 8px 16px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel-card { 
    flex-shrink: 0; width: 200px; border-radius: 24px; 
    background: var(--surface-container-high); overflow: hidden; 
    scroll-snap-align: start; display: flex; flex-direction: column; 
    position: relative; box-shadow: 0 1px 4px var(--shadow);
  }
  .carousel-card .cc-title { 
    position: absolute; bottom: 0; left: 0; right: 0; padding: 16px; 
    font-size: 16px; font-weight: 600; color: var(--on-surface); 
    background: linear-gradient(transparent, var(--surface-container-high) 40%); 
    text-align: center;
  }

  /* 区块标题 */
  .section-title { font-size: 22px; font-weight: 700; color: var(--on-surface); padding: 24px 16px 8px; display: flex; align-items: center; gap: 8px; }
  .section-title .material-symbols-rounded { color: var(--primary); }

  .material-symbols-rounded { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none; line-height: 1; display: inline-block; }
</style>
</head>
<body>
<div id="app-frame">
  
  <!-- 顶部应用栏 -->
  <header class="m3e-appbar">
    <span class="title">Tiry 团队</span>
  </header>

  <div class="screen-scroll">
    
    <!-- 顶部介绍卡片 -->
    <div style="padding: 8px 16px 16px;">
      <div class="card elevated">
        <div class="img-box logo-box" style="width: 100%; border-bottom: 1px solid var(--outline-variant);">
          <img src="https://cloudflareimg.cdn.sn/i/6acb9606406df_1791727110.png" alt="Tiry" fetchpriority="high" decoding="async">
        </div>
        <div class="card-body" style="text-align: center; align-items: center;">
          <div class="card-title">欢迎来到 Tiry 的主页</div>
          <div class="card-text">童友，共成长，同进步。<br>Tiry 是一群初中生们自己的团队。</div>
        </div>
      </div>
    </div>

    <!-- 理念卡片 -->
    <div style="padding: 0 16px;">
      <div class="card" style="background: var(--secondary-container); color: var(--on-secondary-container); padding: 16px; flex-direction: row; align-items: center; gap: 12px;">
        <span class="material-symbols-rounded" style="font-size: 32px; color: var(--secondary);">explore</span>
        <div style="font-size: 15px; font-weight: 500; line-height: 1.4;">
          探索，开发，学习，互助……<br>这就是 Tiry 存在的意义。
        </div>
      </div>
    </div>

    <!-- 开发者轮播 (大尺寸) -->
    <div class="section-title">
      <span class="material-symbols-rounded">code</span> 核心开发者
    </div>
    <div class="carousel">
      <div class="carousel-card" style="width: 260px;">
        <div class="cc-img img-box">
          <img src="https://img.scdn.io/i/6acb97a301667_1791727523.webp" alt="天边橒" fetchpriority="high" decoding="async">
        </div>
        <div class="cc-title">天边橒（团长）</div>
      </div>
      <div class="carousel-card" style="width: 260px;">
        <div class="cc-img img-box">
          <img src="https://img.scdn.io/i/6acb972f6f781_1791727407.webp" alt="Jidurt" fetchpriority="high" decoding="async">
        </div>
        <div class="cc-title">Jidurt</div>
      </div>
    </div>

    <!-- 其他成员轮播 (小尺寸) -->
    <div class="section-title">
      <span class="material-symbols-rounded">groups</span> 团队成员
    </div>
    <div class="carousel">
      <div class="carousel-card">
        <div class="cc-img img-box">
          <img src="https://img.scdn.io/i/6acb96b258c5b_1791727282.webp" alt="冉欣妍" loading="lazy" decoding="async">
        </div>
        <div class="cc-title">冉欣妍·ꦿ໊ོr.lin</div>
      </div>
      <div class="carousel-card">
        <div class="cc-img img-box">
          <img src="https://img.scdn.io/i/6acb9654c7c4b_1791727188.webp" alt="请输入文本" loading="lazy" decoding="async">
        </div>
        <div class="cc-title">请输入文本</div>
      </div>
      <div class="carousel-card">
        <div class="cc-img img-box">
          <img src="https://img.scdn.io/i/6acb967fc6981_1791727231.webp" alt="Sky双叶" loading="lazy" decoding="async">
        </div>
        <div class="cc-title">Sky双叶</div>
      </div>
    </div>

    <!-- 底部按钮区 -->
    <div style="padding: 32px 16px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center;">
      
      <a href="./nav.html" class="btn btn-filled">
        <span class="material-symbols-rounded">apps</span>进入全站导航中心
      </a>

      <a href="./tiryhi.html" class="btn btn-outlined">
        <span class="material-symbols-rounded">arrow_forward</span>体验 TiryHi 项目
      </a>

      <a href="./contact.html" class="btn btn-outlined">
        <span class="material-symbols-rounded">chat</span>联系我们
      </a>

      <a href="./invite.html" class="btn btn-outlined">
        <span class="material-symbols-rounded">campaign</span>想在我们的网站发东西吗？
      </a>
      
    </div>

    <!-- 底部文字 -->
    <div style="text-align:center; padding: 16px 16px 32px; font-size: 13px; color: var(--outline);">
      Tiry 主页 · 学生团队出品<br>
      © 2026 Tiry Team.
    </div>
    
  </div>
</div>

<script>
// 图片加载淡入效果
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.img-box img').forEach(img => {
    const box = img.parentElement;
    if (!box) return;
    if (img.complete && img.naturalWidth > 0) {
      box.classList.add('loaded');
    } else {
      img.addEventListener('load', () => box.classList.add('loaded'), { once: true });
      img.addEventListener('error', () => box.classList.add('loaded'), { once: true });
    }
  });
});
</script>
</body>
</html>
