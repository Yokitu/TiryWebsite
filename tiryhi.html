function searchSubmit(){const q=value('searchInput');if(!q){toast('请输入搜索关键词或网址');return}const u=validUrl(q)||(/^[^\s.]+\.[^\s.]+$/.test(q)?validUrl('https://'+q):null);if(u){openPage({title:q,url:u});return}const bases={Bing:'https://www.bing.com/search?q=',Google:'https://www.google.com/search?q=',百度:'https://www.baidu.com/s?wd=','360':'https://www.so.com/s?q='};openUrl(bases[store.settings.engine]+encodeURIComponent(q))}
function base32ToBytes(s){const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits=0,n=0,out=[];for(const c of s.replace(/=|\s/g,'').toUpperCase()){let v=alphabet.indexOf(c);if(v<0)throw Error('密钥无效');n=n*32+v;bits+=5;if(bits>=8){bits-=8;out.push(Math.floor(n/2**bits)&255);n%=2**bits}}return new Uint8Array(out)}
async function totp(){const key=await crypto.subtle.importKey('raw',base32ToBytes('TJJY64GFWPR6YGDB'),{name:'HMAC',hash:'SHA-1'},false,['sign']);const time=Math.floor(Date.now()/30000),arr=new Uint8Array(8);let x=time;for(let i=7;i>=0;i--){arr[i]=x&255;x=Math.floor(x/256)}const digest=new Uint8Array(await crypto.subtle.sign('HMAC',key,arr)),offset=digest.at(-1)&15,v=((digest[offset]&127)<<24)|(digest[offset+1]<<16)|(digest[offset+2]<<8)|digest[offset+3];return String(v%1000000).padStart(6,'0')}
function setSession(verified){store.session={verified,at:Date.now()};if(store.settings.remember)save('session');else localStorage.removeItem('tiryhi_session');stack=[{name:'home'}];direction='enter';render()}
